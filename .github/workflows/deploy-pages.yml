name: Build Land of Shopping into docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: land-of-shopping-docs
  cancel-in-progress: true

jobs:
  build-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ryans-land/package-lock.json

      - name: Install dependencies
        working-directory: ryans-land
        run: npm ci

      - name: Build Vite site
        working-directory: ryans-land
        run: npm run build

      - name: Refresh docs from dist
        run: |
          rm -rf docs
          mkdir -p docs
          cp -R ryans-land/dist/. docs/
          touch docs/.nojekyll

      - name: Commit generated Pages site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "docs already current"
          else
            git commit -m "Deploy Land of Shopping to docs"
            git push origin main
          fi
